[package]
name = "vision"
version = "0.1.0"
edition = "2024"

[dependencies]
common = { path = "../common" }
ort = { version = "2.0.0-rc.12", features = ["ndarray"] }
ndarray = "0.15"
image = "0.24"
opencv = { version = "0.92", default-features = false, features = ["videoio", "imgproc", "highgui"] }
eframe = { version = "0.27", default-features = false, features = ["glow", "default_fonts", "wayland", "x11"] }
egui = "0.27"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
